<form class="main-container" [formGroup]="planATripForm">
	<div>
		<h1>{{ 'plan-a-trip.title' | transloco }}</h1>
		<app-trip-form [tripGroup]="planATripForm.controls['trip']"></app-trip-form>
	</div>
	<div>
		<!-- componente da crew -->
		<button type="button" class="tertiary-btn create-btn" matButton="filled" [disabled]="planATripForm.invalid" 
		(click)="submitTrip()">{{ 'plan-a-trip.create-trip' | transloco }}</button>
	</div>
</form>
