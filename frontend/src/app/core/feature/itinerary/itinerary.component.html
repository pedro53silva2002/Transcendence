<div class="page">
  <app-navbar
    [showSearch]="true"
    [showProfile]="true"
    [showLanguageSelector]="true"
    [showLogout]="true"
  ></app-navbar>
  <div class="page-content">
    <div class="itin-card">
      <!-- Header -->
      <div class="itin-head">
        <h1 class="itin-title">Itinerary</h1>
        <button
          class="add-btn"
          [class.open]="showForm()"
          (click)="toggleForm()"
          [attr.aria-label]="showForm() ? 'Close add form' : 'Add itinerary item'"
          [attr.aria-expanded]="showForm()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>

      <!-- Stop list -->
      <div class="itin-list-wrap">
        <ul #listRef class="itin-list" role="list" aria-label="Itinerary stops">
          @if (items().length === 0) {
            <li class="empty">No stops yet — tap + to add one.</li>
          }
          @for (item of items(); track item.id) {
            <li class="itin-row">
              <div class="avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="8" r="3.4" fill="currentColor" />
                  <path d="M5 19.5c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5" fill="currentColor" />
                </svg>
              </div>
              <div class="row-main">
                <span class="row-title">{{ item.title }}</span>
                <span class="row-sub">{{ item.description }}</span>
              </div>
              <div class="row-end">
                <span class="row-cost">{{ item.expectedPrice }}€</span>
                <button
                  class="del-btn"
                  (click)="removeItem(item.id)"
                  [attr.aria-label]="'Remove ' + item.title"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3.2"
                    stroke-linecap="round"
                    aria-hidden="true"
                  >
                    <path d="M6 6l12 12M18 6L6 18" />
                  </svg>
                </button>
              </div>
            </li>
          }
        </ul>
      </div>

      <!-- Add form (collapsible) -->
      <div class="form-collapse" [class.open]="showForm()" [attr.aria-hidden]="!showForm()">
        <div class="form-inner">
          <div class="itin-form">
            <div class="form-line">
              <label class="sr-only" for="itin-title">Title</label>
              <input
                id="itin-title"
                class="pill grow"
                placeholder="title"
                [value]="titleValue()"
                (input)="titleValue.set($any($event.target).value)"
                (keydown)="onKeyDown($event)"
              />
              <label class="sr-only" for="itin-cost">Cost in euros</label>
              <input
                id="itin-cost"
                class="pill cost"
                placeholder="cost (€)"
                [value]="costValue()"
                (input)="filterCost($event)"
                (keydown)="onKeyDown($event)"
                inputmode="decimal"
              />
            </div>
            <div class="form-line">
              <label class="sr-only" for="itin-info">More info</label>
              <input
                id="itin-info"
                class="pill grow"
                placeholder="more info"
                [value]="infoValue()"
                (input)="infoValue.set($any($event.target).value)"
                (keydown)="onKeyDown($event)"
              />
              <button class="save-btn" (click)="saveItem()" [disabled]="!canSave()">Save</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Day navigation -->
      <div class="day-bar">
        <div class="day-pill" role="group" aria-label="Day navigation">
          <button
            class="day-arrow"
            (click)="changeDay(-1)"
            [disabled]="prevDisabled()"
            aria-label="Previous day"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </button>
          <span class="day-label" aria-live="polite">DAY {{ currentDay() }}</span>
          <button
            class="day-arrow"
            (click)="changeDay(1)"
            [disabled]="nextDisabled()"
            aria-label="Next day"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
