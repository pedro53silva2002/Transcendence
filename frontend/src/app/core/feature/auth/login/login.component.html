<div class="dialog-header">
	<app-close-button color="var(--mat-sys-on-primary)"></app-close-button>
</div>
<div class="title">
	<h2 mat-dialog-title>{{ 'auth.login' | transloco }}</h2>
	<hr>
</div>
<form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
	<mat-dialog-content>
		<mat-form-field appearance="outline" [hideRequiredMarker]="true" subscriptSizing="dynamic">
			<input matInput type="username" formControlName="username" placeholder="{{ 'auth.username' | transloco }}" required>
		</mat-form-field>
		<mat-form-field appearance="outline" [hideRequiredMarker]="true" subscriptSizing="dynamic">
			<input matInput type="password" [type]="passwordVisible() ? 'text' : 'password'" formControlName="password"
				placeholder="{{ 'auth.password' | transloco }}" required>
			<button type="button" mat-icon-button matSuffix (click)="passwordVisible.set(!passwordVisible())"
				[attr.aria-pressed]="passwordVisible()">
				<mat-icon>{{ passwordVisible() ? 'visibility' : 'visibility_off' }}</mat-icon>
			</button>
		</mat-form-field>
	</mat-dialog-content>
	@if (showLoginErrorMessage()) {
	<span class="credentials-error-message">
		{{ 'auth.error-login' | transloco }}
	</span>
	}
	<mat-dialog-actions>
		<button matButton="filled" type="submit" class="btn-login" [disabled]="form.invalid">{{ 'auth.login' | transloco
			}}</button>
		<app-google-auth-button></app-google-auth-button>
		@if (showOAuthErrorMessage) {
		<div class="error-message">
			<p>{{ 'auth.error-oauth' | transloco }}</p>
		</div>
		}
	</mat-dialog-actions>
</form>
