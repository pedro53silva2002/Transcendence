<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{ 'auth.register' | transloco }}</h2>
    <button type="button" mat-icon-button mat-dialog-close class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="register-form">
    <div class="input-fields">
      <mat-form-field appearance="outline" [hideRequiredMarker]="true">
        <input matInput type="text" formControlName="username" placeholder="username" />
      </mat-form-field>
      <mat-form-field appearance="outline" [hideRequiredMarker]="true">
        <input matInput type="email" formControlName="email" placeholder="email" />
      </mat-form-field>
      <mat-form-field appearance="outline" [hideRequiredMarker]="true">
        <input matInput type="password" formControlName="password" placeholder="password" />
      </mat-form-field>
      <mat-form-field appearance="outline" [hideRequiredMarker]="true">
        <input matInput type="password" formControlName="confirmPassword" placeholder="confirm password" />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button type="submit" mat-flat-button class="register-btn" [disabled]="form.invalid">
      {{ 'auth.register' | transloco }}
    </button>
  </mat-dialog-actions>
</form>
