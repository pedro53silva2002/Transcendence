<div class="title">
	<h2 mat-dialog-title>Login</h2>
	<hr>
</div>
<mat-dialog-content>
	<div class="login-form">
		<mat-form-field appearance="outline" [hideRequiredMarker]="true">
			<input matInput type="text" placeholder="username" required>
		</mat-form-field>
		<mat-form-field appearance="outline" [hideRequiredMarker]="true">
			<input matInput type="text" placeholder="password" required>
		</mat-form-field>
		<button matButton="filled" class="btn-login">Login</button>
		<app-google-auth-button></app-google-auth-button>
	</div>
</mat-dialog-content>
