<div class="dialog-header">
	<app-close-button color="var(--mat-sys-on-primary)"></app-close-button>
</div>
<div class="title">
	<h2 mat-dialog-title>{{ 'auth.login' | transloco }}</h2>
	<hr>
</div>
<form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
	<mat-dialog-content>
		<mat-form-field appearance="outline" [hideRequiredMarker]="true" subscriptSizing="dynamic">
			<input matInput type="email" formControlName="email" placeholder="{{ 'auth.email' | transloco }}" required>
			<!-- @if (form.get('email')?.hasError('email') && form.get('email')?.touched) {
				<mat-error>Formato de email inválido</mat-error>
			} -->
		</mat-form-field>
		<mat-form-field appearance="outline" [hideRequiredMarker]="true" subscriptSizing="dynamic">
			<input matInput type="password" formControlName="password" placeholder="{{ 'auth.password' | transloco }}"
				required>
		</mat-form-field>
	</mat-dialog-content>
	@if (showLoginErrorMessage()) {
	<span class="credentials-error-message">
		Invalid e-mail or password.
	</span>
	}
	<mat-dialog-actions>
		<button matButton="filled" type="submit" class="btn-login" [disabled]="form.invalid">{{ 'auth.login' | transloco }}</button>
		<app-google-auth-button></app-google-auth-button>
		@if (showOAuthErrorMessage) {
		<div class="error-message">
			<p>Google Authentication failed.</p>
		</div>
		}
	</mat-dialog-actions>
</form>
