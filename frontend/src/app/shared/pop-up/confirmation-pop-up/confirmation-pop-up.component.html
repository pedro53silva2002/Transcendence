<h2 class="title" mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
	<p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
	<button class="tertiary-btn btn" mat-button (click)="onCancel()">{{ 'popup.cancel-btn' | transloco }}</button>
	<button class="primary-btn btn" mat-button color="primary" (click)="onConfirm()">{{ 'popup.confirm-btn' | transloco }}</button>
</mat-dialog-actions>
