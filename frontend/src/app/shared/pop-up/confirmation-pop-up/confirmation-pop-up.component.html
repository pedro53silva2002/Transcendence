<h2 class="title" mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
	<p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
	<button class="btn" mat-button (click)="onCancel()">Cancel</button>
	<button class="btn" mat-button color="primary" (click)="onConfirm()">Confirm</button>
</mat-dialog-actions>
