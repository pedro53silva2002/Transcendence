<div class="stats">
	<div class="circle">
		<h1>{{ countriesCount() }}</h1>
		<p>{{ 'stats.countries' | transloco }} </p>
	</div>
	<div class="circle">
		<h1>{{ tripsCount() }}</h1>
		<p>{{ 'stats.trips' | transloco }} </p>
	</div>
	@if (targetId() === loggedUser && daysCountdown() !== "0") {
		<div class="circle">
			<h1>{{ daysCountdown() }}</h1>
			<p>{{ 'stats.countdown' | transloco }} </p>
		</div>
	}
</div>
