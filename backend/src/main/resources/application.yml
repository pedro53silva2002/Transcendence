server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: transcendence-backend

  # PostgreSQL connection — values come from .env via docker-compose
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-db}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # Hibernate: validate-only — Flyway owns the schema
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50

  # Flyway: runs versioned SQL migrations from src/main/resources/db/migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis (used later for sessions / cache)
  data:
    redis:
      host: ${REDIS_HOST:redis-cache}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.transcendence: DEBUG
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES}
  refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
