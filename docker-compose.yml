services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      # - frontend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:5024/api/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build: 
      context: ./backend
    container_name: backend-server
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      BACKEND_PORT: "${BACKEND_PORT}"
      POSTGRES_PORT: "${POSTGRES_PORT}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_URL: "jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_HOST: "redis-cache"
      REDIS_PORT: "${REDIS_PORT}"
      MINIO_ENDPOINT: "minio-storage:${MINIO_PORT}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/api/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 90s

  #Database of the project
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  #Will be used to store session and/or cache
  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: redis:7
    container_name: redis-cache
    restart: unless-stopped
    expose:
      - "${REDIS_PORT}"
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    volumes:
      - redis-data:/data
    networks:
      - app-network

  #Object storage for the project, used to store user uploaded files
  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    expose:
      - "${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}"
    command: ["server", "/data", "--console-address", ":${MINIO_CONSOLE_PORT}", "--address", ":${MINIO_PORT}"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio-data:/data
    networks:
      - app-network
  
  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: frontend
  #   expose:
  #     #may have to change later
  #     - "${FRONTEND_PORT}"
  #   environment:
  #     # add later
  #   networks:
  #     - app-network

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  app-network:
    driver: bridge