services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL}"
    container_name: frontend-server
    restart: unless-stopped
    expose:
      - "${FRONTEND_PORT}"
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: backend-server
    restart: unless-stopped
    expose:
      - "${BACKEND_PORT}"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      ASPNETCORE_URLS: "http://+:${BACKEND_PORT}"
      ASPNETCORE_ENVIRONMENT: "Production"
      BACKEND_PORT: "${BACKEND_PORT}"
      POSTGRES_PORT: "${POSTGRES_PORT}"
      POSTGRES_HOST: "postgres-db"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_HOST: "redis-cache"
      REDIS_PORT: "${REDIS_PORT}"
      MINIO_ENDPOINT: "http://minio-storage:${MINIO_PORT}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ACCESS_TOKEN_TTL_MINUTES: "${JWT_ACCESS_TOKEN_TTL_MINUTES}"
      JWT_REFRESH_TOKEN_TTL_DAYS: "${JWT_REFRESH_TOKEN_TTL_DAYS}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
      GOOGLE_OAUTH_REDIRECT_URI: "${GOOGLE_OAUTH_REDIRECT_URI}"
      FRONTEND_OAUTH_SUCCESS_URI: "${FRONTEND_OAUTH_SUCCESS_URI}"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:${BACKEND_PORT}/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    expose:
      - "${POSTGRES_PORT}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis-cache
    restart: unless-stopped
    expose:
      - "${REDIS_PORT}"
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    expose:
      - "${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}"
    command:
      [
        "server",
        "/data",
        "--console-address",
        ":${MINIO_CONSOLE_PORT}",
        "--address",
        ":${MINIO_PORT}",
      ]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio-data:/data
    networks:
      - app-network

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  app-network:
    driver: bridge
